<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>Edge Gestures 渲染预览（开发用）</title>
<style>
  body { margin: 0; font: 13px/1.6 "Segoe UI", system-ui, sans-serif; background: #fff; }
  .bar { position: fixed; top: 0; left: 0; right: 0; background: #f6f6f6; border-bottom: 1px solid #ddd; padding: 8px 14px; z-index: 1; }
  .bar button { margin-right: 8px; }
  .spacer { height: 60px; }
  .content { padding: 0 14px; }
</style>
</head>
<body>
  <div class="bar">
    <strong>Edge Gestures 渲染预览</strong> ——
    <button id="btnDL">模拟 ↓←（停止加载）</button>
    <button id="btnRU">模拟 →↑（新标签页）</button>
    <button id="btnClear">清除</button>
    <span>验证点：轨迹 #0078D4 / 4.33px 圆头；气泡视口正中、300×148、圆角26、rgba(0,0,0,.7)、图标+文字</span>
  </div>
  <div class="spacer"></div>
  <div class="content">
    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. 中文正文用于对比轨迹跨行时的颜色表现（应为普通覆盖、不随背景变暗）。</p>
  </div>

  <script src="../shared/gestures.js"></script>
  <script src="../content/trail.js"></script>
  <script src="../content/bubble.js"></script>
  <script>
    const cfg = { trailColor: '#0078D4', trailWidth: 4.33 };

    // 沿折线插值出 mousemove 轨迹点
    function pathPoints(pts, step = 8) {
      const out = [];
      for (let i = 1; i < pts.length; i++) {
        const [x0, y0] = pts[i - 1], [x1, y1] = pts[i];
        const d = Math.hypot(x1 - x0, y1 - y0);
        const n = Math.max(1, Math.round(d / step));
        for (let s = 1; s <= n; s++) out.push([x0 + (x1 - x0) * s / n, y0 + (y1 - y0) * s / n]);
      }
      return out;
    }

    function simulate(seqPath, label) {
      clear();
      const points = pathPoints(seqPath);
      const trail = new EdgeGest.Trail(cfg);
      trail.setPoints(points);
      trail.show();
      // 静态展示时不跑 rAF 循环也行，但 Trail.show 自带循环；手动喂一次绘制
      const bubble = new EdgeGest.Bubble(cfg);
      bubble.show();
      bubble.update(pointsToSeq(seqPath), null, label);
      window.__demo = { trail, bubble };
    }

    function pointsToSeq(pts) {
      // 粗略把折线转成方向序列（仅预览用）
      const seq = [];
      for (let i = 1; i < pts.length; i++) {
        const dx = pts[i][0] - pts[i - 1][0], dy = pts[i][1] - pts[i - 1][1];
        const d = Math.abs(dx) >= Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U');
        if (!seq.length || seq[seq.length - 1] !== d) seq.push(d);
      }
      return seq;
    }

    function clear() {
      if (window.__demo) {
        window.__demo.trail.hide();
        window.__demo.bubble.hide();
        window.__demo = null;
      }
    }

    document.getElementById('btnDL').onclick = () =>
      simulate([[200, 200], [200, 520], [40, 520]], '停止加载');
    document.getElementById('btnRU').onclick = () =>
      simulate([[500, 400], [900, 400], [900, 140]], '打开新标签页');
    document.getElementById('btnClear').onclick = clear;
  </script>
</body>
</html>
